# The platforms-starter-kit card: what the console's Blueprints page renders
# and the platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and commerce — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: platforms-starter-kit
  displayName: Platforms — a multi-tenant app on Cloudflare Workers KV
  description: >
    Vercel's Platforms Starter Kit as a product of its own: a multi-tenant
    app where anyone creates a tenant with a name and an emoji, every tenant
    gets its own page and an admin page lists them, built by OpenNext into
    one Cloudflare Worker with Static Assets, the tenants in a Workers KV
    namespace Terraform provisions per environment, and CI that applies the
    namespace and deploys the app to stage and prod on merge. Tenants answer
    at /s/<tenant> on workers.dev from the first deploy, and as subdomains
    once the root domain's wildcard route points at the Worker. One
    provider, one consent, one token. Live in about fifteen minutes, in one
    landing.
  tags: [multi-tenant, kv, cloudflare, nextjs, terraform]
spec:
  source:
    repo: sourceplane/platforms-starter-kit
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      A multi-tenant Next.js app on Cloudflare: tenants created from a form,
      each with its own page, stored in Workers KV. Merge, and the namespace
      is applied before the Worker that binds it is deployed.
    architecture:
      - layer: Edge
        items: [web]
      - layer: Data
        items: [Workers KV (cloudflare-kv)]
      - layer: Delivery
        items: [GitHub Actions, OpenNext, Terraform]
    outcome:
      - Live on stage and prod, in one landing
      - The KV namespace applied before the Worker that binds it
      - Tenants created and served on workers.dev from the first deploy
      - Every merge redeploys, smoke-tested
      - Its own CI from the first commit

  requires:
    # Cloudflare is the only provider connection a bootstrap needs. GitHub
    # arrives as the App installation plus the repo link, not as a
    # connection row.
    integrations: [github, cloudflare]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Site name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name visitors see — every page's title, and above the landing page's heading.
      example: Acme Tenants
    - key: productdomain
      label: Tenant root domain
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
      help: >-
        The domain tenants become subdomains of — <tenant>.<domain> on prod,
        <tenant>.stage.<domain> on stage. It does not need to exist yet: the
        site goes live on workers.dev first, tenants at /s/<tenant>, until
        you point the domain's wildcard route at it.
      example: tenants.acme.dev
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the site's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the site deploys into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. (The account's
      # subdomain, not a tenant's: tenants are `<tenant>.<root>` on the
      # product domain, the owner's step.) It belongs to the account the same
      # way its id does, and there is exactly one right answer — a typed one
      # could only be wrong, and wrong showed up after deploy, in the deploy's
      # smoke, the phase probes and the verify URLs below. The integration
      # reads it from Cloudflare at connect and on its hourly health check;
      # the bootstrap door fills this input from the connection the build is
      # BOUND to, the same one CLOUDFLARE_ACCOUNT_ID and the deploy tokens
      # mint from, so all three name one account. The console renders no
      # field for it. An account with no workers.dev subdomain refuses the
      # build at the door, naming the fix, before anything is created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's `orun.integrations/reconcile@v1`
  # hooks mint these, brokered, during 01-product. ─────────────────────────
  # Transcribed from those hooks' own `keys:` and `template:` values, so
  # testing/manifest.test.sh compares this list to the document that mints
  # them. The console renders them read-only: no credential is ever typed,
  # shown or stored. Keys that already exist are kept. The KV namespace ids
  # are not here: they are not credentials, and the namespace's own apply
  # publishes them. Nothing third-party is asked for: the app has no
  # runtime secret.
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Applies the KV namespace and deploys the Worker and its static assets
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: platforms-baselining     # = repo-blueprint.yaml's `epicSlug` default
    epicName: "Platforms baselining — {productname}"
    milestones:
      # The whole product is one landing (01-product): the repository, the KV
      # root, the app and its tests are one pull request and one convergence.
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes. An estimate until a bootstrap
    # measures it.
    expectedMinutes: 14
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  verify:
    urls:
      - "https://{reponame}-web-{env}.{subdomain}.workers.dev"
    envs: [stage, prod]
