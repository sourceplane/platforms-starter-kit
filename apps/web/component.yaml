apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Platforms Starter Kit (multi-tenant subdomains, tenants in Workers KV; Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The KV namespace must exist before this deploys: its id is rendered into
  # wrangler.jsonc from the root's wiring document (the `KV` binding).
  dependsOn:
    - component: cloudflare-kv
  secretEnv:
    WIRING_CLOUDFLARE_KV_STAGE: "secret://platforms-starter-kit/platforms-starter-kit/stage/WIRING_CLOUDFLARE_KV"
    WIRING_CLOUDFLARE_KV_PROD: "secret://platforms-starter-kit/platforms-starter-kit/prod/WIRING_CLOUDFLARE_KV"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: platforms-starter-kit-web-{dev,stage,prod}.
    workerName: platforms-starter-kit-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the KV root's wiring
    # document (the verify lane already rendered from the fixture through
    # `wire:fixture`; a deploy lane re-renders with the real namespace id),
    # then build. The root domain tenants hang off is the environment's
    # BASE_DOMAIN (intent.yaml); `next build` inlines it as
    # NEXT_PUBLIC_ROOT_DOMAIN into the server and client bundles.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-kv --env "${ORUN_ENVIRONMENT}" && NEXT_PUBLIC_ROOT_DOMAIN="${BASE_DOMAIN}" pnpm exec turbo run build --filter=@app/web

    # Smoke: the landing page renders (the workers.dev host is not a tenant
    # subdomain of BASE_DOMAIN, so the proxy serves the root) and carries the
    # template's call to action.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Create your own subdomain with a custom emoji'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
